<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Carte Aisne</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body {
    font-family: Arial;
    margin: 0;
}
#map {
    height: 100vh;
}

/* Boîte des coordonnées */
#coordsBox {
    position: absolute;
    top: 10px;
    left: 10px;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-size: 14px;
    z-index: 1000;
}

/* Panneau de filtres */
#filterBox {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
    font-size: 14px;
    z-index: 1000;
    min-width: 140px;
}
#filterBox h4 {
    margin: 0 0 10px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #444;
    border-bottom: 1px solid #ddd;
    padding-bottom: 6px;
}
.filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    cursor: pointer;
}
.filter-row input[type="checkbox"] {
    accent-color: #3a7bd5;
    width: 15px;
    height: 15px;
    cursor: pointer;
}
.filter-row label {
    cursor: pointer;
    font-size: 13px;
    color: #333;
    font-weight: 600;
    letter-spacing: 0.03em;
}
</style>
</head>
<body>

<div id="coordsBox">
    Latitude : <span id="lat">--</span><br>
    Longitude : <span id="lng">--</span>
</div>

<div id="filterBox">
    <h4>Filtres</h4>
    <div class="filter-row">
        <input type="checkbox" id="f-MRC" checked>
        <label for="f-MRC">MRC</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-VAL" checked>
        <label for="f-VAL">VAL</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-MA" checked>
        <label for="f-MA">MA</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-ANIM" checked>
        <label for="f-ANIM">ANIM</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-MCV" checked>
        <label for="f-MCV">MCV</label>
    </div>
</div>

<div id="map"></div>

<script>
// --- Limites de l'Aisne ---
var limitesAisne = L.latLngBounds(
    [49.1, 2.9],
    [50.2, 4.3]
);

// --- Carte centrée sur l'Aisne ---
var map = L.map('map', {
    maxBounds: limitesAisne,
    maxBoundsViscosity: 1.0
}).setView([49.5, 3.5], 9);

map.setMinZoom(8);

// --- Fond de carte ---
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// --- Icône verte ---
var greenIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// --- Icône bleue ---
var blueIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// --- Données des lieux ---
var lieux = [
    {
        nom: "Cathédrale de Laon",
        adresse: "02000 Laon",
        desc: "",
        roles: [],
        lat: 49.5638,
        lng: 3.6217,
        icon: blueIcon
    },
    {
        nom: "Lycée Julie-Daubié",
        adresse: "02000 Laon",
        desc: "Lycée technologique.",
        roles: [],
        lat: 49.56040,
        lng: 3.61136,
        icon: greenIcon
    },
    {
        nom: "Carrefour Brossolette",
        adresse: "Laon (02000)",
        desc: "Commerce agroalimentaire.",
        roles: ["ANIM", "MCV"],
        lat: 49.5572,
        lng: 3.6050,
        icon: greenIcon
    }
];

// --- Création des marqueurs ---
var markers = [];

lieux.forEach(function(lieu) {
    var m = L.marker([lieu.lat, lieu.lng], { icon: lieu.icon })
        .addTo(map)
        .bindPopup(
            "<b>" + lieu.nom + "</b><br>" +
            lieu.adresse +
            (lieu.desc ? "<br>" + lieu.desc : "") +
            (lieu.roles.length ? "<br><small>" + lieu.roles.join(", ") + "</small>" : "")
        );
    markers.push({ marker: m, lieu: lieu });
});

// --- Filtrage ---
function applyFilters() {
    var actifs = [];
    ["MRC", "VAL", "MA", "ANIM", "MCV"].forEach(function(role) {
        if (document.getElementById("f-" + role).checked) actifs.push(role);
    });

    markers.forEach(function(obj) {
        var roles = obj.lieu.roles;

        // Pas de rôle = toujours visible (ex: Cathédrale, Lycée)
        if (roles.length === 0) {
            obj.marker.addTo(map);
            return;
        }

        // Visible si au moins un rôle coché correspond
        var visible = roles.some(function(r) { return actifs.includes(r); });
        if (visible) {
            obj.marker.addTo(map);
        } else {
            map.removeLayer(obj.marker);
        }
    });
}

// --- Écoute des cases à cocher ---
["MRC", "VAL", "MA", "ANIM", "MCV"].forEach(function(role) {
    document.getElementById("f-" + role).addEventListener("change", applyFilters);
});

// --- Coordonnées en temps réel ---
map.on('mousemove', function(e) {
    document.getElementById('lat').textContent = e.latlng.lat.toFixed(5);
    document.getElementById('lng').textContent = e.latlng.lng.toFixed(5);
});
</script>
</body>
</html>
