<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Carte Aisne</title>

<link <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
    font-family: Arial;
    margin:0;
}

#map{
    height:100vh;
}

/* Style de la légende */
.legend {
    background: white;
    padding: 10px;
    line-height: 18px;
    color: #333;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
}
.legend i {
    width: 18px;
    height: 18px;
    float: left;
    margin-right: 8px;
    opacity: 0.9;
}

/* Boîte des coordonnées */
#coordsBox {
    position: absolute;
    top: 10px;
    left: 10px;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-size: 14px;
    z-index: 1000;
}
</style>

</head>

<body>

<!-- Boîte affichant les coordonnées -->
<div id="coordsBox">
    Latitude : <span id="lat">--</span><br>
    Longitude : <span id="lng">--</span>
</div>

<!-- Carte -->
<div id="map"></div>

<script src="leaflet/leaflet.js"></script>

<script>

// --- Limites de l'Aisne (empêche de sortir) ---
var limitesAisne = L.latLngBounds(
    [49.1, 2.9],   // Sud-Ouest
    [50.2, 4.3]    // Nord-Est
);

// --- Carte centrée sur l'Aisne ---
var map = L.map('map', {
    maxBounds: limitesAisne,
    maxBoundsViscosity: 1.0
}).setView([49.5, 3.5], 9);

map.setMinZoom(8);

// --- Fond de carte ---
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap'
}).addTo(map);

// --- Icône verte personnalisée ---
var greenIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
    shadowUrl: 'leaflet/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// --- Icône bleue personnalisée ---
var blueIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
    shadowUrl: 'leaflet/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// --- Cathédrale de Laon ---
L.marker([49.5638, 3.6217], {icon: blueIcon})
.addTo(map)
.bindPopup("<b>Cathédrale de Laon</b><br>02000 Laon");

// --- Lycée Julie-Daubié ---
L.marker([49.56040, 3.61136], {icon: greenIcon})
.addTo(map)
.bindPopup("<b>Lycée Julie-Daubié</b><br>02000 Laon<br>Lycée technologique.");

// --- Légende ---
var legend = L.control({position: 'bottomright'});

legend.onAdd = function (map) {
    var div = L.DomUtil.create('div', 'legend');
    div.innerHTML += "<h4>Légende</h4>";
    div.innerHTML += '<i style="background:blue"></i><span>Cathédrale de Laon</span><br>';
    div.innerHTML += '<i style="background:green"></i><span>Lycée Julie-Daubié</span><br>';
    return div;
};

legend.addTo(map);

// --- Affichage des coordonnées en temps réel ---
map.on('mousemove', function(e) {
    document.getElementById('lat').textContent = e.latlng.lat.toFixed(5);
    document.getElementById('lng').textContent = e.latlng.lng.toFixed(5);
});

</script>

</body>
</html>
