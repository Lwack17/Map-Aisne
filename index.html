<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Carte Aisne</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body {
    font-family: Arial;
    margin: 0;
}
#map {
    height: 100vh;
}

/* Panneau de filtres */
#filterBox {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
    font-size: 14px;
    z-index: 1000;
    min-width: 140px;
}
#filterBox h4 {
    margin: 0 0 10px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #444;
    border-bottom: 1px solid #ddd;
    padding-bottom: 6px;
}
.filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    cursor: pointer;
}
.filter-row input[type="checkbox"] {
    accent-color: #3a7bd5;
    width: 15px;
    height: 15px;
    cursor: pointer;
}
.filter-row label {
    cursor: pointer;
    font-size: 13px;
    color: #333;
    font-weight: 600;
    letter-spacing: 0.03em;
}

/* Fenêtre coordonnées */
#coordModal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 16px 20px;
    border-radius: 8px;
    box-shadow: 0 0 16px rgba(0,0,0,0.4);
    z-index: 2000;
    font-size: 14px;
    min-width: 220px;
}
#coordModal h4 {
    margin: 0 0 10px 0;
    font-size: 13px;
    color: #444;
    border-bottom: 1px solid #ddd;
    padding-bottom: 6px;
}
#coordModal p {
    margin: 4px 0;
    color: #222;
}
#coordModal button {
    margin-top: 12px;
    width: 100%;
    padding: 6px;
    background: #3a7bd5;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
}
#coordModal button:hover {
    background: #2f63b0;
}
</style>
</head>
<body>

<div id="filterBox">
    <h4>Filtres</h4>
    <div class="filter-row">
        <input type="checkbox" id="f-MRC" checked>
        <label for="f-MRC">MRC</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-VAL" checked>
        <label for="f-VAL">VAL</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-MA" checked>
        <label for="f-MA">MA</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-ANIM" checked>
        <label for="f-ANIM">ANIM</label>
    </div>
    <div class="filter-row">
        <input type="checkbox" id="f-MCV" checked>
        <label for="f-MCV">MCV</label>
    </div>
</div>

<!-- Fenêtre coordonnées -->
<div id="coordModal">
    <h4>📍 Coordonnées du clic</h4>
    <p>Latitude : <strong id="modalLat">--</strong></p>
    <p>Longitude : <strong id="modalLng">--</strong></p>
    <button onclick="document.getElementById('coordModal').style.display='none'">Fermer</button>
</div>

<div id="map"></div>

<script>
// --- Limites de l'Aisne ---
var limitesAisne = L.latLngBounds(
    [49.1, 2.9],
    [50.2, 4.3]
);

// --- Carte ---
var map = L.map('map', {
    maxBounds: limitesAisne,
    maxBoundsViscosity: 1.0,
    doubleClickZoom: false
}).setView([49.5, 3.5], 9);

map.setMinZoom(8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// --- Double clic → affiche coordonnées ---
map.on('dblclick', function(e) {
    L.DomEvent.stopPropagation(e);
    L.DomEvent.preventDefault(e);
    document.getElementById('modalLat').textContent = e.latlng.lat.toFixed(5);
    document.getElementById('modalLng').textContent = e.latlng.lng.toFixed(5);
    document.getElementById('coordModal').style.display = 'block';
});

// --- Icônes ---
var greenIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

var blueIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

var redIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// --- Données des lieux ---
var lieux = [
    {
        nom: "Lycée Julie-Daubié",
        adresse: "02000 Laon",
        desc: "Lycée professionnel.",
        roles: [],
        lat: 49.56040,
        lng: 3.61136,
        icon: greenIcon
    },
    {
        nom: "Carrefour Romanette",
        adresse: "Laon (02000)",
        desc: "Commerce agroalimentaire.",
        roles: ["ANIM", "MRC"],
        lat: 49.54785,
        lng: 3.61429,
        icon: greenIcon
    },
    {
        nom: "Centre de Tourisme",
        adresse: "Laon (02000)",
        desc: "Lieu de renseignements.",
        roles: ["MA", "MRC"],
        lat: 49.56418,
        lng: 3.62407,
        icon: redIcon
    },
    {
        nom: "Banque Crédit Agricole",
        adresse: "50 Boulevard Pierre Brossolette, 02000 Laon",
        desc: "Banque publique.",
        roles: ["VAL", "MRC"],
        lat: 49.56951,
        lng: 3.61598,
        icon: blueIcon
    },
    {
        nom: "Groupe Colbeaux",
        adresse: "17 Rue Turgot, 02000 Laon",
        desc: "Concessionnaire automobile",
        roles: ["VAL", "MRC"],
        lat: 49.57934,
        lng: 3.65640,
        icon: blueIcon
    },
    {
        nom: "Hôtel Ibis",
        adresse: "1134 avenue Georges Pompidou 02000 Laon",
        desc: "Etablissement d'hebergement",
        roles: ["MA", "MRC"],
        lat: 49.55009,
        lng; 3.61930,
        icon: RedIcon


];

// --- Marqueurs ---
var markers = [];

lieux.forEach(function(lieu) {
    var m = L.marker([lieu.lat, lieu.lng], { icon: lieu.icon })
        .addTo(map)
        .bindPopup(
            "<b>" + lieu.nom + "</b><br>" +
            lieu.adresse +
            (lieu.desc ? "<br>" + lieu.desc : "") +
            (lieu.roles.length ? "<br><small>" + lieu.roles.join(", ") + "</small>" : "")
        );
    markers.push({ marker: m, lieu: lieu });
});

// --- Filtrage ---
function applyFilters() {
    var actifs = [];
    ["MRC", "VAL", "MA", "ANIM", "MCV"].forEach(function(role) {
        if (document.getElementById("f-" + role).checked) actifs.push(role);
    });

    markers.forEach(function(obj) {
        var roles = obj.lieu.roles;
        if (roles.length === 0) {
            obj.marker.addTo(map);
            return;
        }
        var visible = roles.some(function(r) { return actifs.includes(r); });
        if (visible) {
            obj.marker.addTo(map);
        } else {
            map.removeLayer(obj.marker);
        }
    });
}

["MRC", "VAL", "MA", "ANIM", "MCV"].forEach(function(role) {
    document.getElementById("f-" + role).addEventListener("change", applyFilters);
});
</script>
</body>
</html>
